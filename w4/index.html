<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板</title>

  <!-- Google 字體（Outfit 與 Noto Sans TC）增添質感 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       1. 全域變數設定（方便後續修改顏色與風格）
       ========================================== */
    :root {
      /* 背景漸層主色調 */
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      
      /* 卡片背景與邊框（玻璃擬態） */
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      
      /* 高亮突顯卡片時的發光與邊框色彩 (粉藍漸層色系) */
      --highlight-border: #38bdf8;
      --highlight-glow: rgba(56, 189, 248, 0.5);
      --highlight-gradient: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(192, 132, 252, 0.2));
      
      /* 文字顏色 */
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      /* 標題套用漸層文字效果 */
      background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    /* ==========================================
       2. 酷炫載入動畫（Loading Spinner）
       ========================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 0;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      /* 載入圖示漸層色軌跡 */
      background: conic-gradient(from 0deg, transparent 0%, #38bdf8 50%, #c084fc 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #fff 0);
      mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #fff 0);
      animation: spin 1s linear infinite;
      margin-bottom: 1.5rem;
    }

    .loading-text {
      font-size: 1.2rem;
      letter-spacing: 2px;
      font-weight: 500;
      animation: pulse 1.5s ease-in-out infinite alternate;
      /* 載入文字漸層 */
      background: linear-gradient(to right, #38bdf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* ==========================================
       3. 瀑布流排版 (Masonry Layout)
       ========================================== */
    .masonry-grid {
      /* 預設大螢幕顯示 3 欄 */
      column-count: 3;
      column-gap: 1.5rem;
      display: none; /* 載入完成後由 JS 改為 block */
    }

    /* 響應式斷點調整欄數 */
    @media (max-width: 900px) {
      .masonry-grid { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-grid { column-count: 1; }
    }

    /* ==========================================
       4. 留言卡片樣式與焦點輪播特效
       ========================================== */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      break-inside: avoid; /* 防止卡片被瀑布流欄位截斷 */
      position: relative;
      overflow: hidden;
      
      /* 動畫平滑過渡 */
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0.85;
      transform: scale(0.98);
    }

    /* 卡片頭部（名字與時間） */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .author {
      font-weight: 700;
      font-size: 1.1rem;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .author-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
    }

    .timestamp {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #e2e8f0;
      white-space: pre-line; /* 支援留言換行 */
    }

    /* --- 重點：被選中卡片的【放大亮起 (Highlight)】特效 --- */
    .card.highlight {
      opacity: 1;
      transform: scale(1.05); /* 放大效果 */
      z-index: 10;
      border-color: var(--highlight-border);
      /* 發光效果 */
      box-shadow: 0 0 25px var(--highlight-glow), inset 0 0 15px rgba(255, 255, 255, 0.05);
      background: var(--highlight-gradient);
    }

    /* 未被選中的卡片：自動壓暗與微幅模糊 */
    .masonry-grid.has-highlight .card:not(.highlight) {
      opacity: 0.35;
      filter: blur(1.5px);
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <header>
    <h1>留言板 Wall of Whispers</h1>
    <p>來自朋友們的悄悄話與祝福</p>
  </header>

  <main class="container">
    <!-- 載入中動畫 -->
    <div id="loading">
      <div class="spinner"></div>
      <div class="loading-text">讀取留言中...</div>
    </div>

    <!-- 留言卡片瀑布流區域 -->
    <div id="wall" class="masonry-grid"></div>
  </main>

  <script>
    // ==========================================
    // 參數設定區 (顏色可在上方 CSS :root 修改)
    // ==========================================
    
    // 【輪播秒數設定】：預設 3000 ms (即 3 秒輪播一次)
    const CAROUSEL_INTERVAL = 3000; 

    // Google 試算表 CSV 網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSlDiO_o8iajdl2nkaeLCjnx4Xn7HPgbDRGaL6QyPIlUEOI7U-zrgyX-Z-Q1gVkoeqsfbuIgndDpU5z/pub?output=csv';

    let cardElements = []; // 儲存生成的卡片 DOM
    let currentIndex = -1; // 當前突顯卡片的索引
    let timer = null;      // 輪播計時器

    // ==========================================
    // 1. CSV 解析函數 (正確處理欄位內含逗號與換行)
    // ==========================================
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let currentToken = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            // 處理雙引號轉義 (””)
            currentToken += '"';
            i++;
          } else {
            // 切換雙引號狀態
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          // 遇逗號且不在雙引號內 -> 欄位結束
          row.push(currentToken.trim());
          currentToken = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          // 遇換行且不在雙引號內 -> 一列結束
          if (char === '\r' && nextChar === '\n') i++; // 處理 \r\n
          row.push(currentToken.trim());
          if (row.length > 1 || row[0] !== '') lines.push(row);
          row = [];
          currentToken = '';
        } else {
          currentToken += char;
        }
      }
      
      // 處理最後一筆資料
      if (currentToken || row.length > 0) {
        row.push(currentToken.trim());
        lines.push(row);
      }

      return lines;
    }

    // ==========================================
    // 2. 獲取資料與渲染頁面
    // ==========================================
    async function fetchAndRenderMessages() {
      try {
        const response = await fetch(CSV_URL);
        const csvText = await response.text();
        
        // 解析 CSV 資料
        const parsedData = parseCSV(csvText);
        
        // 排除第一列標題 (時間戳記, 名字, 悄悄話)
        const rows = parsedData.slice(1);

        const wall = document.getElementById('wall');
        const loading = document.getElementById('loading');

        // 清空容器
        wall.innerHTML = '';

        // 整理資料並生成卡片
        rows.forEach((row) => {
          // 確保欄位存在（欄位 0: 時間戳記, 欄位 1: 名字, 欄位 2: 悄悄話）
          const timestamp = row[0] || '未知時間';
          const name = row[1] || '匿名朋友';
          const message = row[2] || '';

          // 若留言為空則跳過
          if (!message) return;

          // 取得姓名第一個字當作 Avatar 圖示
          const avatarChar = name.charAt(0).toUpperCase();

          // 建立卡片元素
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-header">
              <div class="author">
                <div class="author-icon">${avatarChar}</div>
                <span>${escapeHTML(name)}</span>
              </div>
              <span class="timestamp">${escapeHTML(timestamp)}</span>
            </div>
            <div class="content">${escapeHTML(message)}</div>
          `;

          wall.appendChild(card);
        });

        // 隱藏 Loading 動畫，顯示瀑布流容器
        loading.style.display = 'none';
        wall.style.display = 'block';

        // 取得所有卡片元素並啟動輪播
        cardElements = Array.from(document.querySelectorAll('.card'));
        if (cardElements.length > 0) {
          startCarousel();
        }

      } catch (error) {
        console.error('抓取留言資料失敗：', error);
        document.getElementById('loading').innerHTML = `
          <div style="color: #ef4444; font-size: 1.1rem;">
            讀取留言失敗，請稍後再試。
          </div>
        `;
      }
    }

    // ==========================================
    // 3. 隨時間輪播亮起特效 (Highlight Carousel)
    // ==========================================
    function startCarousel() {
      const wall = document.getElementById('wall');
      
      // 標記容器啟動焦點模式 (開啟非焦點卡片的模糊/減暗效果)
      wall.classList.add('has-highlight');

      function nextHighlight() {
        // 移除前一張卡片的高亮
        if (currentIndex >= 0 && cardElements[currentIndex]) {
          cardElements[currentIndex].classList.remove('highlight');
        }

        // 計算下一次要亮起的卡片索引 (循環)
        currentIndex = (currentIndex + 1) % cardElements.length;

        // 為當前卡片加上高亮 class
        const currentCard = cardElements[currentIndex];
        currentCard.classList.add('highlight');

        // 自動將視覺焦點平滑滾動至該卡片（大幅增強展覽播放感）
        currentCard.scrollIntoView({
          behavior: 'smooth',
          block: 'nearest'
        });
      }

      // 立即執行第一次突顯
      nextHighlight();

      // 設定定時器，每隔 CAROUSEL_INTERVAL (3秒) 切換一次
      timer = setInterval(nextHighlight, CAROUSEL_INTERVAL);
    }

    // 防範 XSS 攻擊的安全轉義函數
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 頁面載入後執行主程式
    window.addEventListener('DOMContentLoaded', fetchAndRenderMessages);
  </script>
</body>
</html>
