<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端心電感應 | 大耳狗夢幻天藍多人默契遊戲</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome CDN Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & Fredoka / Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cinnamoroll: {
              skyLight: '#F0F9FF',
              sky: '#E0F2FE',
              blueSoft: '#BAE6FD',
              blueMedium: '#38BDF8',
              blueDeep: '#0284C7',
              blueNight: '#0369A1',
              pinkLight: '#FCE7F3',
              pinkSoft: '#F472B6',
              cloud: '#FFFFFF',
              text: '#1E293B',
              muted: '#64748B'
            }
          },
          fontFamily: {
            sans: ['Fredoka', 'Noto Sans TC', 'sans-serif'],
          },
          borderRadius: {
            '4xl': '2rem',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: linear-gradient(180deg, #E0F2FE 0%, #F0F9FF 50%, #E0F2FE 100%);
      color: #1E293B;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Floating Cloud Animations */
    @keyframes floatCloud {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }

    .animate-cloud-float {
      animation: floatCloud 4s ease-in-out infinite;
    }

    .animate-cloud-float-slow {
      animation: floatCloud 7s ease-in-out infinite;
    }

    /* 3D Card Flip CSS */
    .card-perspective {
      perspective: 1200px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.34, 1.3, 0.64, 1);
      transform-style: preserve-3d;
    }

    /* Card flipped state: show FRONT (Answer reveal) */
    .card-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 1.5rem;
    }

    /* BACK of the card (Hidden state before reveal) */
    .card-back-face {
      transform: rotateY(0deg);
    }

    /* FRONT of the card (Revealed Answer state) */
    .card-front-face {
      transform: rotateY(180deg);
    }

    /* Custom Cloud Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #F0F9FF;
    }
    ::-webkit-scrollbar-thumb {
      background: #BAE6FD;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #38BDF8;
    }
  </style>
</head>
<body class="flex flex-col justify-between selection:bg-cinnamoroll-pinkLight selection:text-cinnamoroll-pinkSoft">

  <!-- Confetti / Star Canvas -->
  <canvas id="starCanvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

  <!-- Cloud Background Decorative Elements -->
  <div class="fixed top-10 -left-12 opacity-40 pointer-events-none animate-cloud-float-slow text-cinnamoroll-blueSoft text-8xl">
    <i class="fa-solid fa-cloud"></i>
  </div>
  <div class="fixed top-36 -right-10 opacity-30 pointer-events-none animate-cloud-float text-cinnamoroll-blueMedium text-9xl">
    <i class="fa-solid fa-cloud"></i>
  </div>
  <div class="fixed bottom-12 left-1/4 opacity-20 pointer-events-none animate-cloud-float-slow text-cinnamoroll-pinkSoft text-7xl">
    <i class="fa-solid fa-heart"></i>
  </div>

  <!-- Header Bar -->
  <header class="bg-white/80 backdrop-blur-md border-b-4 border-cinnamoroll-blueSoft sticky top-0 z-40 transition-all shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      
      <!-- Logo & Cinnamoroll Theme Header -->
      <div class="flex items-center space-x-3 cursor-pointer group" onclick="toggleHostConsoleByClickLogo()">
        <div class="w-11 h-11 rounded-2xl bg-cinnamoroll-sky border-2 border-cinnamoroll-blueMedium flex items-center justify-center text-cinnamoroll-blueDeep text-xl shadow-inner group-hover:scale-105 transition">
          <i class="fa-solid fa-cloud-moon text-cinnamoroll-blueDeep"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-lg text-cinnamoroll-text flex items-center gap-2">
            雲端心電感應
            <span class="text-xs font-bold bg-cinnamoroll-pinkLight text-cinnamoroll-pinkSoft px-2.5 py-0.5 rounded-full border border-cinnamoroll-pinkSoft/30 flex items-center gap-1">
              <i class="fa-solid fa-wand-magic-sparkles text-[10px]"></i> 大耳狗夢幻版
            </span>
          </h1>
          <p class="text-xs text-cinnamoroll-muted">Cinnamoroll Telepathy ‧ 3D 同步翻牌</p>
        </div>
      </div>

      <!-- Header Tools & Controls -->
      <div class="flex items-center space-x-2">
        <!-- Status Indicator Badge -->
        <div id="backendBadge" class="hidden sm:flex items-center gap-1.5 text-xs px-3 py-1 rounded-full bg-cinnamoroll-sky text-cinnamoroll-blueDeep font-semibold border border-cinnamoroll-blueSoft">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
          <span id="backendBadgeText">GAS 連線中</span>
        </div>

        <!-- Sound Toggle -->
        <button id="soundToggleBtn" onclick="toggleSound()" class="w-9 h-9 flex items-center justify-center rounded-2xl bg-white text-cinnamoroll-blueDeep border-2 border-cinnamoroll-blueSoft hover:bg-cinnamoroll-sky transition shadow-xs" title="切換音效">
          <i id="soundIcon" class="fa-solid fa-volume-high text-sm"></i>
        </button>

        <!-- Hidden Host Console Trigger Icon (Star Key) -->
        <button id="hiddenHostBtn" onclick="toggleHostConsole()" class="w-9 h-9 flex items-center justify-center rounded-2xl bg-cinnamoroll-pinkLight text-cinnamoroll-pinkSoft border-2 border-cinnamoroll-pinkSoft/40 hover:scale-105 transition shadow-xs" title="隱藏房主控制台">
          <i class="fa-solid fa-star text-sm"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full relative z-10">

    <!-- 1. LOGIN / ROOM ENTRY SCREEN -->
    <div id="loginScreen" class="max-w-md mx-auto my-6 bg-white/95 border-4 border-cinnamoroll-blueSoft rounded-4xl p-6 sm:p-8 shadow-xl relative overflow-hidden backdrop-blur-sm">
      <div class="absolute -top-12 -right-12 w-28 h-28 bg-cinnamoroll-sky rounded-full blur-xl pointer-events-none"></div>

      <!-- Cinnamoroll Cute Icon Banner -->
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-cinnamoroll-sky border-3 border-cinnamoroll-blueMedium text-cinnamoroll-blueDeep text-4xl mb-3 shadow-md animate-cloud-float">
          <i class="fa-solid fa-face-smile-beam"></i>
        </div>
        <h2 class="text-2xl font-black text-cinnamoroll-text">加入雲端默契考驗</h2>
        <p class="text-xs text-cinnamoroll-muted mt-1.5 font-medium">輸入你的專屬暱稱與房間號碼，測測大家的心電感應！</p>
      </div>

      <form onsubmit="handleJoinRoom(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-extrabold text-cinnamoroll-blueDeep uppercase tracking-wider mb-1.5">
            <i class="fa-solid fa-user-astronaut mr-1"></i> 玩家暱稱 / Nickname
          </label>
          <div class="relative">
            <input type="text" id="inputPlayerName" required placeholder="例如：大耳狗、小卡比" 
                   class="w-full px-4 py-3 text-sm bg-cinnamoroll-skyLight border-2 border-cinnamoroll-blueSoft rounded-2xl focus:outline-none focus:border-cinnamoroll-blueDeep focus:bg-white font-bold transition">
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-extrabold text-cinnamoroll-blueDeep uppercase tracking-wider">
              <i class="fa-solid fa-door-open mr-1"></i> 房間號碼 / Room Code
            </label>
            <button type="button" onclick="generateRandomRoomCode()" class="text-xs text-cinnamoroll-pinkSoft font-bold hover:underline flex items-center gap-1">
              <i class="fa-solid fa-dice text-xs"></i> 隨機生成
            </button>
          </div>
          <div class="relative">
            <input type="text" id="inputRoomCode" required placeholder="例如：8888 或 CLASS-A" maxlength="12"
                   class="w-full px-4 py-3 text-sm uppercase font-mono tracking-widest font-extrabold bg-cinnamoroll-skyLight border-2 border-cinnamoroll-blueSoft rounded-2xl focus:outline-none focus:border-cinnamoroll-blueDeep focus:bg-white transition">
          </div>
        </div>

        <div class="pt-3 space-y-2.5">
          <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-cinnamoroll-blueMedium to-cinnamoroll-blueDeep hover:opacity-95 text-white font-extrabold text-base rounded-2xl shadow-lg shadow-cinnamoroll-blueMedium/30 transition transform active:scale-95 flex items-center justify-center gap-2">
            <span>開始連線進入房間</span>
            <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
          </button>

          <button type="button" onclick="handleJoinAsHost(event)" class="w-full py-3 bg-cinnamoroll-pinkLight hover:bg-cinnamoroll-pinkSoft hover:text-white text-cinnamoroll-pinkSoft font-bold text-xs rounded-2xl transition border-2 border-cinnamoroll-pinkSoft/40 flex items-center justify-center gap-2 shadow-xs">
            <i class="fa-solid fa-crown text-amber-400"></i>
            <span>以房主身份創建房間</span>
          </button>
        </div>
      </form>

      <!-- Quick Room Shortcuts -->
      <div class="mt-6 pt-4 border-t-2 border-dashed border-cinnamoroll-blueSoft/60 text-center">
        <p class="text-xs text-cinnamoroll-muted font-bold mb-2">一鍵體驗預設房間：</p>
        <div class="flex justify-center gap-2">
          <button onclick="quickJoin('小白雲', '8888')" class="px-3.5 py-1.5 bg-cinnamoroll-sky hover:bg-cinnamoroll-blueSoft text-cinnamoroll-blueDeep font-bold text-xs rounded-xl border border-cinnamoroll-blueMedium/30 transition">
            #8888 (測試房A)
          </button>
          <button onclick="quickJoin('布丁狗', 'CLASS-A')" class="px-3.5 py-1.5 bg-cinnamoroll-pinkLight hover:bg-cinnamoroll-pinkSoft hover:text-white text-cinnamoroll-pinkSoft font-bold text-xs rounded-xl border border-cinnamoroll-pinkSoft/40 transition">
            #CLASS-A (班級房)
          </button>
        </div>
      </div>
    </div>


    <!-- 2. GAME ROOM MAIN SCREEN -->
    <div id="gameScreen" class="hidden space-y-6">
      
      <!-- Room Info Header Card -->
      <div class="bg-white/90 border-4 border-cinnamoroll-blueSoft rounded-3xl p-4 sm:p-5 shadow-lg backdrop-blur-md flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        
        <div class="flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-cinnamoroll-blueSoft to-cinnamoroll-blueMedium flex items-center justify-center text-white font-mono font-extrabold text-xl shadow-md border-2 border-white">
            <i class="fa-solid fa-hashtag"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span id="displayRoomCode" class="text-xl font-black font-mono tracking-wider text-cinnamoroll-text">----</span>
              <button onclick="copyRoomCode()" class="text-xs text-cinnamoroll-blueDeep bg-cinnamoroll-sky hover:bg-cinnamoroll-blueSoft p-1.5 rounded-xl transition" title="複製房號">
                <i class="fa-regular fa-copy"></i>
              </button>
              <span id="hostIdentityBadge" class="hidden text-xs font-black px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-700 border border-amber-300">
                <i class="fa-solid fa-crown mr-1 text-amber-500"></i>房主身份
              </span>
            </div>
            <p class="text-xs text-cinnamoroll-muted font-bold mt-0.5">
              目前玩家：<span id="displayPlayerName" class="text-cinnamoroll-blueDeep font-extrabold">--</span>
            </p>
          </div>
        </div>

        <!-- Room Global Status Tag & Exit -->
        <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
          <div id="gameStatusTag" class="px-4 py-2 rounded-2xl text-xs font-black bg-cinnamoroll-sky text-cinnamoroll-blueDeep border-2 border-cinnamoroll-blueSoft flex items-center gap-2 shadow-xs">
            <i class="fa-solid fa-cloud animate-bounce"></i>
            <span id="gameStatusText">等待房主出題中...</span>
          </div>

          <button onclick="leaveRoom()" class="px-3.5 py-2 border-2 border-cinnamoroll-blueSoft hover:bg-red-50 hover:border-red-300 hover:text-red-600 text-cinnamoroll-muted font-bold rounded-2xl text-xs transition flex items-center gap-1.5">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>離開</span>
          </button>
        </div>
      </div>

      <!-- Current Question Card Banner -->
      <div class="bg-gradient-to-r from-white via-cinnamoroll-skyLight to-cinnamoroll-sky border-4 border-cinnamoroll-blueSoft rounded-3xl p-6 shadow-xl relative overflow-hidden">
        <div class="absolute -right-6 -bottom-6 text-cinnamoroll-blueSoft/30 text-9xl pointer-events-none font-black">
          <i class="fa-solid fa-quote-right"></i>
        </div>
        <div class="relative z-10 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-black text-cinnamoroll-blueDeep uppercase tracking-widest flex items-center gap-1.5">
              <i class="fa-solid fa-sparkles text-cinnamoroll-pinkSoft"></i> 當前默契考驗題目
            </span>
            <span id="cardCountBadge" class="text-xs font-black text-cinnamoroll-blueDeep bg-white px-3 py-1 rounded-full border border-cinnamoroll-blueSoft shadow-xs">
              已填答 0 人
            </span>
          </div>
          <h3 id="displayQuestion" class="text-xl sm:text-2xl font-black text-cinnamoroll-text leading-relaxed">
            (房主正在構思題目中...)
          </h3>
        </div>
      </div>

      <!-- Player Answer Input Form -->
      <div id="answerSection" class="bg-white border-4 border-cinnamoroll-blueSoft rounded-3xl p-5 shadow-lg space-y-3">
        <div class="flex items-center justify-between">
          <label class="text-xs font-black text-cinnamoroll-blueDeep uppercase tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-pen-paintbrush text-cinnamoroll-pinkSoft"></i> 寫下你的直覺答案
          </label>
          <span id="myAnswerStateBadge" class="text-xs font-extrabold text-cinnamoroll-muted">尚未送出</span>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
          <input type="text" id="myAnswerInput" placeholder="寫下與大家最有默契的詞彙..." 
                 class="flex-1 px-4 py-3 text-sm font-bold bg-cinnamoroll-skyLight border-2 border-cinnamoroll-blueSoft rounded-2xl focus:outline-none focus:border-cinnamoroll-blueDeep focus:bg-white transition">
          
          <button onclick="submitMyAnswer()" class="px-6 py-3 bg-gradient-to-r from-emerald-400 to-teal-500 hover:opacity-95 text-white font-black text-sm rounded-2xl transition shadow-md flex items-center justify-center gap-2 shrink-0 active:scale-95">
            <i class="fa-solid fa-paper-plane text-xs"></i>
            <span>傳送心電感應</span>
          </button>
        </div>
      </div>

      <!-- HIDDEN HOST MANAGEMENT CONSOLE -->
      <div id="hostConsolePanel" class="hidden bg-gradient-to-br from-amber-50 to-orange-50 border-4 border-amber-300 rounded-3xl p-5 shadow-xl space-y-4">
        <div class="flex items-center justify-between border-b-2 border-amber-200/80 pb-3">
          <div class="flex items-center gap-2 text-amber-800 font-black text-sm">
            <i class="fa-solid fa-crown text-amber-500 text-lg"></i>
            <span>隱藏房主控制台 (Host Controls)</span>
          </div>
          <button onclick="toggleHostConsole()" class="text-xs font-bold text-amber-700 hover:bg-amber-100 px-2.5 py-1 rounded-xl transition">
            <i class="fa-solid fa-xmark"></i> 關閉控制台
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
          <!-- Question Input & Presets -->
          <div class="md:col-span-7 space-y-2">
            <label class="block text-xs font-extrabold text-amber-900">出題 / 更換心電感應題目：</label>
            <div class="flex gap-2">
              <input type="text" id="hostQuestionInput" placeholder="例如：想到大耳狗第一個聯想到的食物？" 
                     class="flex-1 px-3.5 py-2.5 text-sm font-bold bg-white border-2 border-amber-300 rounded-2xl focus:outline-none focus:border-amber-500">
              <button onclick="hostSetQuestion()" class="px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-black text-xs rounded-2xl transition shadow-sm shrink-0">
                發佈題目 (set_question)
              </button>
            </div>
            
            <!-- Quick Preset Questions -->
            <div class="flex flex-wrap gap-1.5 pt-1">
              <span class="text-[11px] font-bold text-amber-800">快速主題：</span>
              <button onclick="applyPresetQuestion('提到冬天第一秒想到的美食？')" class="text-[11px] font-bold px-2.5 py-0.5 bg-white border border-amber-300 text-amber-900 rounded-xl hover:bg-amber-100 transition">🍲 冬天美食</button>
              <button onclick="applyPresetQuestion('KTV 必點的經典華語歌曲？')" class="text-[11px] font-bold px-2.5 py-0.5 bg-white border border-amber-300 text-amber-900 rounded-xl hover:bg-amber-100 transition">🎤 KTV神曲</button>
              <button onclick="applyPresetQuestion('最想去的放鬆旅遊國家？')" class="text-[11px] font-bold px-2.5 py-0.5 bg-white border border-amber-300 text-amber-900 rounded-xl hover:bg-amber-100 transition">✈️ 旅遊國家</button>
              <button onclick="applyPresetQuestion('用一個可愛詞彙形容房主？')" class="text-[11px] font-bold px-2.5 py-0.5 bg-white border border-amber-300 text-amber-900 rounded-xl hover:bg-amber-100 transition">👑 形容房主</button>
            </div>
          </div>

          <!-- Reveal & Round Reset Buttons -->
          <div class="md:col-span-5 flex flex-col justify-between space-y-2">
            <label class="block text-xs font-extrabold text-amber-900">遊戲狀態控制：</label>
            <div class="grid grid-cols-2 gap-2">
              <button id="btnHostReveal" onclick="hostRevealAll()" class="py-3 bg-gradient-to-r from-cinnamoroll-pinkSoft to-pink-500 hover:opacity-95 text-white font-black text-xs rounded-2xl shadow-md transition flex items-center justify-center gap-1.5 active:scale-95">
                <i class="fa-solid fa-eye text-sm"></i>
                <span>一鍵開牌 (Reveal)</span>
              </button>

              <button onclick="hostResetRound()" class="py-3 bg-white hover:bg-red-50 text-red-600 border-2 border-red-200 font-extrabold text-xs rounded-2xl transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-rotate-left"></i> 重置本局 (Reset)
              </button>
            </div>

            <button onclick="addSimulatedBotPlayers()" class="w-full py-2 bg-white hover:bg-amber-100 text-amber-900 border border-amber-300 font-bold text-xs rounded-xl transition flex items-center justify-center gap-1">
              <i class="fa-solid fa-robot text-amber-600"></i> + 加入測試機器人 (測試同步開牌)
            </button>
          </div>
        </div>
      </div>

      <!-- 3D CARDS GRID AREA -->
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <h4 class="text-base font-black text-cinnamoroll-text flex items-center gap-2">
            <i class="fa-solid fa-users-viewfinder text-cinnamoroll-blueDeep"></i>
            <span>心電感應雲端陣列</span>
            <span id="playerCountTag" class="text-xs font-bold text-cinnamoroll-blueDeep bg-white px-2.5 py-0.5 rounded-full border border-cinnamoroll-blueSoft">0 人在線</span>
          </h4>

          <div class="text-xs font-bold text-cinnamoroll-muted flex items-center gap-2">
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400"></span> 已傳送答案
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-cinnamoroll-sky border border-cinnamoroll-blueSoft ml-2"></span> 作答中
          </div>
        </div>

        <!-- Cards Responsive Grid -->
        <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-5">
          <!-- Flip Cards dynamic insertion -->
        </div>

        <!-- Empty State Notice -->
        <div id="emptyPlayersNotice" class="hidden bg-white/90 border-4 border-dashed border-cinnamoroll-blueSoft rounded-3xl p-10 text-center space-y-2">
          <i class="fa-solid fa-cloud-sun text-4xl text-cinnamoroll-blueSoft animate-cloud-float"></i>
          <p class="text-sm font-bold text-cinnamoroll-muted">房間內尚無其他玩家填答，分享房號邀請朋友吧！</p>
        </div>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t-2 border-cinnamoroll-blueSoft py-4 bg-white/70 text-center text-xs text-cinnamoroll-muted font-bold mt-8 relative z-10">
    <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p class="flex items-center gap-1">
        <i class="fa-solid fa-heart text-cinnamoroll-pinkSoft"></i>
        <span>雲端心電感應 ‧ 大耳狗夢幻天藍主題</span>
      </p>
      <p class="flex items-center gap-3 text-[11px]">
        <span><i class="fa-solid fa-rotate text-cinnamoroll-blueDeep animate-spin"></i> Polling 2s 全網頁同步中</span>
        <span>|</span>
        <button onclick="toggleHostConsole()" class="hover:underline text-cinnamoroll-blueDeep">房主控制台</button>
      </p>
    </div>
  </footer>


  <!-- JAVASCRIPT APP LOGIC -->
  <script>
    /**
     * GAS Backend Specification & Constants
     */
    const SHEET_NAME = 'TelepathyData';
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzQdfzaXuZUu4Z94g9QG30yaXcdkq9ByMcdcM48Z_lFhunYO3FNVHUCN-jb7W0ZpY5-zQ/exec";

    // Application State Variables
    let currentRoomCode = '';
    let currentPlayerName = '';
    let isHost = false;
    let roomQuestion = '';
    let roomStatus = 'setup'; // 'setup', 'playing', 'revealed'
    let roomAnswers = {}; // { "PlayerName": "Answer" }
    let pollingTimer = null;
    let soundEnabled = true;
    let logoClickCounter = 0;
    let previousRoomStatus = 'setup';

    // Cinnamoroll Pastel Avatar Styles
    const avatarStyles = [
      { bg: 'bg-sky-100', text: 'text-sky-600', border: 'border-sky-300' },
      { bg: 'bg-pink-100', text: 'text-pink-600', border: 'border-pink-300' },
      { bg: 'bg-purple-100', text: 'text-purple-600', border: 'border-purple-300' },
      { bg: 'bg-emerald-100', text: 'text-emerald-600', border: 'border-emerald-300' },
      { bg: 'bg-amber-100', text: 'text-amber-600', border: 'border-amber-300' }
    ];

    // Initialization
    window.onload = function() {
      // Check saved session
      const savedName = localStorage.getItem('TELEPATHY_USER_NAME');
      const savedRoom = localStorage.getItem('TELEPATHY_ROOM_CODE');
      if (savedName) document.getElementById('inputPlayerName').value = savedName;
      if (savedRoom) document.getElementById('inputRoomCode').value = savedRoom;
      else generateRandomRoomCode();
    };

    function generateRandomRoomCode() {
      const code = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById('inputRoomCode').value = code;
    }

    function quickJoin(name, room) {
      document.getElementById('inputPlayerName').value = name;
      document.getElementById('inputRoomCode').value = room;
    }

    /**
     * Login & Room Joining
     */
    function handleJoinRoom(e) {
      if (e) e.preventDefault();
      const name = document.getElementById('inputPlayerName').value.trim();
      const room = document.getElementById('inputRoomCode').value.trim().toUpperCase();

      if (!name || !room) return;

      currentPlayerName = name;
      currentRoomCode = room;
      isHost = false;

      saveSession();
      enterGameRoom();
    }

    function handleJoinAsHost(e) {
      if (e) e.preventDefault();
      const name = document.getElementById('inputPlayerName').value.trim() || '房主大耳狗';
      const room = document.getElementById('inputRoomCode').value.trim().toUpperCase() || '8888';

      currentPlayerName = name;
      currentRoomCode = room;
      isHost = true;

      saveSession();
      enterGameRoom();
    }

    function saveSession() {
      localStorage.setItem('TELEPATHY_USER_NAME', currentPlayerName);
      localStorage.setItem('TELEPATHY_ROOM_CODE', currentRoomCode);
    }

    function enterGameRoom() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');

      document.getElementById('displayRoomCode').innerText = currentRoomCode;
      document.getElementById('displayPlayerName').innerText = currentPlayerName;

      if (isHost) {
        document.getElementById('hostIdentityBadge').classList.remove('hidden');
        document.getElementById('hostConsolePanel').classList.remove('hidden');
      } else {
        document.getElementById('hostIdentityBadge').classList.add('hidden');
        document.getElementById('hostConsolePanel').classList.add('hidden');
      }

      // Initial Fetch & Start Polling (Every 2 seconds)
      fetchRoomState();
      if (pollingTimer) clearInterval(pollingTimer);
      pollingTimer = setInterval(fetchRoomState, 2000);
    }

    function leaveRoom() {
      if (pollingTimer) clearInterval(pollingTimer);
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    }

    /**
     * API Fetch Logic with GAS Compatibility & Fallback
     */
    function fetchRoomState() {
      if (GAS_API_URL && GAS_API_URL.trim() !== '') {
        const url = GAS_API_URL + "?room=" + encodeURIComponent(currentRoomCode);
        fetch(url)
          .then(res => res.json())
          .then(data => {
            if (data) {
              updateUIState(data.question || '', data.status || 'setup', data.answers || {});
            }
          })
          .catch(err => {
            console.warn('GAS URL error or CORS, falling back to local sync:', err);
            let localData = getMockData(currentRoomCode);
            updateUIState(localData.question, localData.status, localData.answers);
          });
      } else {
        let localData = getMockData(currentRoomCode);
        updateUIState(localData.question, localData.status, localData.answers);
      }
    }

    function postGASAction(payload, callback) {
      if (GAS_API_URL && GAS_API_URL.trim() !== '') {
        fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
          if (callback) callback(data);
          fetchRoomState();
        })
        .catch(err => {
          console.warn('GAS POST failed, using local fallback:', err);
          handleLocalAction(payload);
          if (callback) callback({ success: true });
          fetchRoomState();
        });
      } else {
        handleLocalAction(payload);
        if (callback) callback({ success: true });
        fetchRoomState();
      }
    }

    /**
     * Player Action: Submit Answer
     */
    function submitMyAnswer() {
      const input = document.getElementById('myAnswerInput');
      const answer = input.value.trim();
      if (!answer) return;

      playChirpSound();

      const payload = {
        action: "submit_answer",
        room: currentRoomCode,
        playerName: currentPlayerName,
        answer: answer
      };

      postGASAction(payload, () => {
        const badge = document.getElementById('myAnswerStateBadge');
        badge.innerText = '✓ 已成功傳送心電感應';
        badge.className = 'text-xs font-black text-emerald-500';
      });
    }

    /**
     * Host Controls
     */
    function hostSetQuestion() {
      const q = document.getElementById('hostQuestionInput').value.trim();
      if (!q) return;

      const payload = {
        action: "set_question",
        room: currentRoomCode,
        question: q
      };

      postGASAction(payload);
    }

    function applyPresetQuestion(presetText) {
      document.getElementById('hostQuestionInput').value = presetText;
      hostSetQuestion();
    }

    function hostRevealAll() {
      const payload = {
        action: "reveal",
        room: currentRoomCode
      };

      postGASAction(payload);
    }

    function hostResetRound() {
      if (!confirm('確定要清空本局的所有題目與答案嗎？')) return;

      const payload = {
        action: "reset",
        room: currentRoomCode
      };

      postGASAction(payload, () => {
        document.getElementById('myAnswerInput').value = '';
        document.getElementById('myAnswerStateBadge').innerText = '尚未送出';
        document.getElementById('myAnswerStateBadge').className = 'text-xs font-extrabold text-cinnamoroll-muted';
      });
    }

    function addSimulatedBotPlayers() {
      const mockBots = [
        { name: '大耳狗', answer: '肉桂捲' },
        { name: '布丁狗', answer: '布丁' },
        { name: '美樂蒂', answer: '草莓蛋糕' },
        { name: '酷洛米', answer: '肉桂捲' }
      ];

      let localData = getMockData(currentRoomCode);
      if (!localData.answers) localData.answers = {};

      mockBots.forEach(b => {
        localData.answers[b.name] = b.answer;
      });

      if (localData.status === 'setup') {
        localData.status = 'playing';
        localData.question = localData.question || '提到下午茶最想吃的甜點？';
      }

      saveMockData(currentRoomCode, localData);
      fetchRoomState();
    }

    /**
     * UI State & Card Rendering
     */
    function updateUIState(question, status, answers) {
      roomQuestion = question || '';
      roomStatus = status || 'setup';
      roomAnswers = answers || {};

      // Play sound and animation on status transition to REVEALED
      if (previousRoomStatus !== 'revealed' && roomStatus === 'revealed') {
        playRevealSound();
        triggerStarConfetti();
      } else if (previousRoomStatus === 'revealed' && roomStatus === 'playing') {
        playFlipSound();
      }
      previousRoomStatus = roomStatus;

      // Update Top Question Header
      const qDisplay = document.getElementById('displayQuestion');
      if (roomStatus === 'setup' || !roomQuestion) {
        qDisplay.innerText = '(房主正在構思題目中...)';
      } else {
        qDisplay.innerText = roomQuestion;
      }

      // Update Status Badge
      const statusTag = document.getElementById('gameStatusTag');
      const statusText = document.getElementById('gameStatusText');
      
      if (roomStatus === 'revealed') {
        statusTag.className = 'px-4 py-2 rounded-2xl text-xs font-black bg-cinnamoroll-pinkLight text-cinnamoroll-pinkSoft border-2 border-cinnamoroll-pinkSoft/40 flex items-center gap-2 shadow-xs';
        statusText.innerText = '★ 全員默契大揭曉 (Revealed)!';
      } else if (roomStatus === 'playing') {
        statusTag.className = 'px-4 py-2 rounded-2xl text-xs font-black bg-cinnamoroll-sky text-cinnamoroll-blueDeep border-2 border-cinnamoroll-blueSoft flex items-center gap-2 shadow-xs';
        statusText.innerText = '玩家填答傳送中 (Playing)...';
      } else {
        statusTag.className = 'px-4 py-2 rounded-2xl text-xs font-black bg-amber-50 text-amber-700 border-2 border-amber-200 flex items-center gap-2 shadow-xs';
        statusText.innerText = '等待房主發佈題目 (Setup)...';
      }

      // Update Answers Count
      const playerNames = Object.keys(roomAnswers);
      const filledCount = playerNames.filter(name => roomAnswers[name] && roomAnswers[name].trim() !== '').length;
      document.getElementById('cardCountBadge').innerText = `已填答 ${filledCount} / ${playerNames.length} 人`;
      document.getElementById('playerCountTag').innerText = `${playerNames.length} 人在線`;

      // Render Cards
      renderCardsGrid(playerNames);
    }

    function renderCardsGrid(playerNames) {
      const grid = document.getElementById('cardsGrid');
      const emptyNotice = document.getElementById('emptyPlayersNotice');

      if (!playerNames || playerNames.length === 0) {
        grid.innerHTML = '';
        emptyNotice.classList.remove('hidden');
        return;
      }

      emptyNotice.classList.add('hidden');
      const isFlippedGlobal = (roomStatus === 'revealed');

      // Calculate Answer Frequencies for Telepathy Match Badges
      const answerFreq = {};
      playerNames.forEach(name => {
        const ans = roomAnswers[name];
        if (ans && ans.trim()) {
          const norm = ans.trim().toLowerCase();
          answerFreq[norm] = (answerFreq[norm] || 0) + 1;
        }
      });

      let html = '';
      playerNames.forEach((name, idx) => {
        const ans = roomAnswers[name];
        const hasAnswer = ans && ans.trim() !== '';
        const style = avatarStyles[idx % avatarStyles.length];
        const initial = name.charAt(0).toUpperCase();

        const isMatch = hasAnswer && (answerFreq[ans.trim().toLowerCase()] > 1);

        html += `
          <div class="card-perspective h-48 w-full">
            <div class="card-inner ${isFlippedGlobal ? 'is-flipped' : ''}">
              
              <!-- BACK FACE (Hidden before reveal) -->
              <div class="card-face card-back-face bg-gradient-to-b from-white via-cinnamoroll-skyLight to-cinnamoroll-sky border-4 border-cinnamoroll-blueSoft p-4 flex flex-col justify-between shadow-md hover:shadow-lg transition">
                <div class="flex items-center justify-between">
                  <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-full ${style.bg} ${style.text} font-black text-xs flex items-center justify-center border ${style.border}">
                      ${initial}
                    </div>
                    <span class="font-extrabold text-sm text-cinnamoroll-text truncate max-w-[100px]">${escapeHtml(name)}</span>
                  </div>
                  ${hasAnswer 
                    ? '<span class="w-3 h-3 rounded-full bg-emerald-400 border-2 border-white shadow-xs" title="已回答"></span>' 
                    : '<span class="w-3 h-3 rounded-full bg-cinnamoroll-sky border border-cinnamoroll-blueSoft" title="思考中"></span>'
                  }
                </div>

                <!-- Cute Cloud Pattern Center -->
                <div class="my-auto text-center py-2">
                  ${hasAnswer 
                    ? `<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 text-xs font-black border border-emerald-300">
                        <i class="fa-solid fa-cloud-check"></i> 心電感應已送出
                       </div>` 
                    : `<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white text-cinnamoroll-muted text-xs font-bold border border-cinnamoroll-blueSoft">
                        <i class="fa-solid fa-cloud-ellipsis animate-pulse"></i> 思考構思中...
                       </div>`
                  }
                </div>

                <div class="text-[11px] font-bold text-cinnamoroll-muted text-center border-t-2 border-dashed border-cinnamoroll-blueSoft/60 pt-2 flex items-center justify-center gap-1">
                  <i class="fa-solid fa-lock text-cinnamoroll-blueMedium"></i>
                  <span>開牌前答案隱藏</span>
                </div>
              </div>

              <!-- FRONT FACE (Revealed answer on flip) -->
              <div class="card-face card-front-face ${isMatch ? 'bg-gradient-to-b from-pink-50 to-cinnamoroll-pinkLight border-cinnamoroll-pinkSoft' : 'bg-white border-cinnamoroll-blueSoft'} border-4 p-4 flex flex-col justify-between shadow-lg">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-black text-cinnamoroll-muted">${escapeHtml(name)} 的解答</span>
                  ${isMatch 
                    ? '<span class="text-[10px] font-black px-2.5 py-0.5 rounded-full bg-cinnamoroll-pinkSoft text-white shadow-sm flex items-center gap-1 animate-bounce"><i class="fa-solid fa-heart text-[8px]"></i> 默契成功</span>' 
                    : ''
                  }
                </div>

                <div class="my-auto text-center px-2">
                  <p class="text-xl font-black ${isMatch ? 'text-cinnamoroll-pinkSoft' : 'text-cinnamoroll-text'} tracking-tight break-words">
                    ${hasAnswer ? escapeHtml(ans) : '<span class="text-cinnamoroll-muted italic font-bold text-sm">未填答</span>'}
                  </p>
                </div>

                <div class="text-[10px] font-black text-cinnamoroll-blueDeep text-right border-t-2 border-dashed border-cinnamoroll-blueSoft/50 pt-1.5 flex items-center justify-end gap-1">
                  <i class="fa-solid fa-sparkles text-cinnamoroll-pinkSoft"></i> Cinnamoroll Sync
                </div>
              </div>

            </div>
          </div>
        `;
      });

      grid.innerHTML = html;
    }

    /**
     * LocalStorage Mock Engine (Fallback for Local Testing & Multi-Tab Sync)
     */
    function getMockData(roomCode) {
      const key = 'TELEPATHY_MOCK_ROOM_' + roomCode;
      const raw = localStorage.getItem(key);
      if (raw) {
        try { return JSON.parse(raw); } catch(e){}
      }
      return {
        status: 'setup',
        question: '提到夏天第一秒想到的水果？',
        answers: {}
      };
    }

    function saveMockData(roomCode, data) {
      const key = 'TELEPATHY_MOCK_ROOM_' + roomCode;
      localStorage.setItem(key, JSON.stringify(data));
    }

    function handleLocalAction(payload) {
      let data = getMockData(payload.room);
      if (payload.action === 'reset') {
        data.status = 'setup';
        data.question = '';
        data.answers = {};
      } else if (payload.action === 'set_question') {
        data.status = 'playing';
        data.question = payload.question;
        data.answers = {};
      } else if (payload.action === 'submit_answer') {
        if (!data.answers) data.answers = {};
        data.answers[payload.playerName] = payload.answer;
      } else if (payload.action === 'reveal') {
        data.status = 'revealed';
      }
      saveMockData(payload.room, data);
    }

    /**
     * Hidden Host Controls Trigger Logic
     */
    function toggleHostConsole() {
      const panel = document.getElementById('hostConsolePanel');
      panel.classList.toggle('hidden');
    }

    function toggleHostConsoleByClickLogo() {
      logoClickCounter++;
      if (logoClickCounter >= 3) {
        toggleHostConsole();
        logoClickCounter = 0;
      }
    }

    // Keyboard shortcut Ctrl+Shift+H for Host Console
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'H' || e.key === 'h')) {
        e.preventDefault();
        toggleHostConsole();
      }
    });

    /**
     * Helpers & Sound Generators
     */
    function copyRoomCode() {
      const tempInput = document.createElement('input');
      tempInput.value = currentRoomCode;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);

      const btn = event.currentTarget;
      btn.innerHTML = '<i class="fa-solid fa-check text-emerald-500"></i>';
      setTimeout(() => btn.innerHTML = '<i class="fa-regular fa-copy"></i>', 1500);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('soundIcon');
      icon.className = soundEnabled ? 'fa-solid fa-volume-high text-sm' : 'fa-solid fa-volume-xmark text-sm opacity-50';
    }

    function playChirpSound() {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1046.5, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch(e){}
    }

    function playFlipSound() {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch(e){}
    }

    function playRevealSound() {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const chords = [523.25, 659.25, 783.99, 1046.50]; // C, E, G, C
        chords.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.08);
          osc.stop(ctx.currentTime + idx * 0.08 + 0.35);
        });
      } catch(e){}
    }

    /**
     * Canvas Star & Ribbon Confetti Animation
     */
    function triggerStarConfetti() {
      const canvas = document.getElementById('starCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#BAE6FD', '#38BDF8', '#F472B6', '#FCE7F3', '#FBBF24'];

      for (let i = 0; i < 70; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.7) * 14,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 12,
          opacity: 1
        });
      }

      let startTime = null;
      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.25;
          p.rotation += p.vRot;
          p.opacity -= 0.015;

          if (p.opacity > 0) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }
        });

        if (elapsed < 1600) {
          requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      requestAnimationFrame(render);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
